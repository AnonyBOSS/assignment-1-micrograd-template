name: PR Autograder

# pull_request_target runs THIS file as it exists on main (not the copy in the PR),
# in the context of this repo. That means:
#   - it runs automatically on fork PRs (no "Approve and run" click needed)
#   - it gets secrets (GCP_SA_KEY), which plain `pull_request` never passes to forks
# Because secrets are available, student code is only ever executed in the `test`
# job, which holds no secrets and only a read-only token. The `report` job, which
# holds the secret, never checks out or runs anything from the PR.
on:
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions: {}

concurrency:
  group: grade-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The only files taken from the student's PR. Everything else (tests, conftest,
  # workflow, __init__.py) comes from main, so students can't edit tests to pass.
  SUBMISSION_FILES: "src/engine.py src/nn.py"
  SPREADSHEET_ID: "1A6q_ElID_rQoUtatNz54LUwn4WnBpJlwVTG_u1tKclM"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted tests from main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: pip install pytest graphviz

      - name: Count expected tests (on the trusted tree, before student code is added)
        id: count
        env:
          PYTHONPATH: .
        run: |
          n=$(python -m pytest --collect-only -q 2>/dev/null | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+' || true)
          echo "Expected tests: ${n:-0}"
          echo "total=${n:-0}" >> "$GITHUB_OUTPUT"

      - name: Fetch the student's PR (not executed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: _submission
          persist-credentials: false
          # Safe here: this job has no secrets, a read-only token, and no caches.
          # Never add this flag to the `report` job, and don't add `cache:` to setup-python.
          allow-unsafe-pr-checkout: true

      - name: Copy only the implementation files into the trusted tree
        run: |
          for f in $SUBMISSION_FILES; do
            if [ -f "_submission/$f" ] && [ ! -L "_submission/$f" ]; then
              cp "_submission/$f" "$f"
              echo "Using student's $f"
            else
              echo "::warning::$f not found in the PR, keeping the template stub"
            fi
          done
          rm -rf _submission

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          set +e
          timeout 300 python -m pytest --tb=short -p no:cacheprovider --junitxml=report.xml > test_results.txt 2>&1
          code=$?
          [ "$code" = "124" ] && echo "Tests timed out after 300s" >> test_results.txt
          cat test_results.txt
          exit 0

      - name: Compute score
        env:
          EXPECTED_TOTAL: ${{ steps.count.outputs.total }}
        run: |
          python - <<'EOF'
          import json, os
          import xml.etree.ElementTree as ET

          total = int(os.environ.get("EXPECTED_TOTAL") or 0)
          passed = 0
          try:
              root = ET.parse("report.xml").getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for s in suites:
                  bad = sum(int(s.get(k, 0)) for k in ("failures", "errors", "skipped"))
                  passed += int(s.get("tests", 0)) - bad
          except Exception as e:
              print(f"No usable report.xml ({e}), scoring 0")

          total = total or passed
          passed = max(0, min(passed, total))
          with open("result.json", "w") as f:
              json.dump({"passed": passed, "total": total}, f)
          print(f"Score: {passed}/{total}")
          EOF

      - name: Upload results for the report job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-results
          path: |
            result.json
            test_results.txt
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      # Deliberately no checkout: nothing from the PR ever enters the job holding secrets.
      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: grading-results

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install sheet dependencies
        run: pip install "gspread>=6" google-auth

      - name: Upsert grade in Google Sheets
        # If the test job broke (infrastructure error), don't overwrite a real grade with 0/0.
        if: needs.test.result == 'success'
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python - <<'EOF'
          import json, os, re, sys
          import gspread
          from google.oauth2.service_account import Credentials

          # result.json was written by the job that ran student code: treat it as untrusted.
          try:
              with open("result.json") as f:
                  res = json.load(f)
              passed, total = int(res["passed"]), int(res["total"])
          except Exception:
              passed, total = 0, 0
          total = max(total, 0)
          passed = max(0, min(passed, total))
          score = f"{passed}/{total}"
          emoji = "🟢" if total and passed == total else "🔴"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SCORE_STR={score} PASSED {emoji}\n")

          raw_key = os.environ.get("GCP_SA_KEY", "").strip()
          if not raw_key:
              sys.exit("GCP_SA_KEY is empty: add it under Settings > Secrets and variables > Actions > Repository secrets.")

          # PR author, not github.actor: on a re-run the actor is whoever clicked re-run.
          handle = os.environ["PR_AUTHOR"]
          branch = os.environ.get("BRANCH_NAME", "")

          # Expected branch format: name-with-hyphens_StudentID (e.g. seif-yasser-ahmed_21P0102)
          student_id, student_name = "", handle
          m = re.fullmatch(r"([A-Za-z]+(?:-[A-Za-z]+)*)_([A-Za-z0-9]{4,12})", branch)
          if m:
              student_name = " ".join(w.capitalize() for w in m.group(1).split("-"))
              student_id = m.group(2).upper()
          else:
              print(f"::warning::Branch '{branch}' doesn't match name-with-hyphens_StudentID; recording by GitHub handle only")

          creds = Credentials.from_service_account_info(
              json.loads(raw_key),
              scopes=["https://www.googleapis.com/auth/spreadsheets"],
          )
          sheet = gspread.authorize(creds).open_by_key(os.environ["SPREADSHEET_ID"]).sheet1

          rows = sheet.get_all_values()
          row_by_handle, row_by_id, id_owner = None, None, ""
          for i, row in enumerate(rows[1:], start=2):
              rid = row[0].strip().upper() if len(row) > 0 else ""
              rhandle = row[2].strip().lower() if len(row) > 2 else ""
              if rhandle == handle.lower():
                  row_by_handle = i
              if student_id and rid == student_id:
                  row_by_id, id_owner = i, rhandle

          if row_by_handle:
              row_index = row_by_handle
          elif row_by_id and id_owner in ("", handle.lower()):
              row_index = row_by_id  # e.g. a roster row pre-filled with the ID only
          elif row_by_id:
              sys.exit(f"Student ID {student_id} already belongs to @{id_owner}; not overwriting. Check this PR manually.")
          else:
              row_index = None

          values = [student_id, student_name, handle, score]
          # RAW so "12/12" is stored as text and not parsed into a date.
          if row_index:
              sheet.update(range_name=f"A{row_index}:D{row_index}", values=[values], value_input_option="RAW")
              print(f"Updated row {row_index}: {values}")
          else:
              sheet.append_row(values, value_input_option="RAW")
              print(f"Appended: {values}")
          EOF

      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_JOB_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const fs = require('fs');
            const read = (p, d) => { try { return fs.readFileSync(p, 'utf8'); } catch { return d; } };
            let log = read('test_results.txt', '(no test output: the test job failed before pytest ran)');
            if (log.length > 60000) log = '...(truncated)\n' + log.slice(-60000);
            const score = process.env.TEST_JOB_RESULT === 'success'
              ? (process.env.SCORE_STR || 'unavailable')
              : '⚠️ grading did not run (autograder error, not your code). Your TA will re-run it.';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- autograder -->';
            const body = `${marker}\n### 🤖 Automated Grading Results\n**Score:** ${score}  \n**Commit:** ${sha}\n\n\`\`\`\`text\n${log}\n\`\`\`\``;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
